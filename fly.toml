# fly.toml app configuration file generated for mars-workflow-analytics-restless-frog-7414 on 2025-01-06T16:11:25-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mars-workflow-analytics-restless-frog-7414'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'mars_workflow_analytics_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
